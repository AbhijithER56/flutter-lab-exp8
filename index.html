<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Reading Room – Experiment 8 | Firestore Book Search</title>
  <meta name="description" content="Flutter Lab Experiment 8: search a books collection by title (preview uses an in-page copy of the collection)." />
  <style>
    :root {
      --espresso: #3B2A20; --parchment: #F5EBD7; --brass: #B8860B; --paper: #FFFAF0;
      --muted: #8B7766; --line: #E3D3BA;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif; color: var(--espresso);
      background: #d9c7aa; min-height: 100vh; padding: 24px 16px;
      display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 24px;
    }
    .phone { width: 390px; max-width: 100%; height: 800px; background: var(--parchment); border: 8px solid #1d130d; border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(59,42,32,.4); }
    .app-bar { background: var(--espresso); color: #fff; text-align: center; padding: 20px 12px 14px; font-weight: 700; font-size: 18px; flex-shrink: 0; }
    .body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: thin; }
    .ui { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }

    .banner { background: var(--espresso); border-radius: 22px; padding: 18px; display: flex; gap: 14px; align-items: center; color: #fff; }
    .banner .em { font-size: 40px; }
    .banner h1 { font-size: 19px; font-weight: 800; }
    .banner p { font-size: 12px; color: #D9C7B0; margin-top: 4px; font-family: system-ui, sans-serif; }

    .search { display: flex; flex-direction: column; gap: 12px; }
    .search label { position: relative; display: block; }
    .search input { width: 100%; padding: 16px 20px 16px 48px; border-radius: 30px; border: 1px solid #DCCBB3; background: var(--paper); font-size: 15px; color: var(--espresso); outline: none; font-family: system-ui, sans-serif; }
    .search input:focus { border: 2px solid var(--brass); padding: 15px 19px 15px 47px; }
    .search .ico { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); }
    .btn { background: var(--espresso); color: #fff; border: none; border-radius: 30px; padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: system-ui, sans-serif; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { background: var(--muted); }

    .hints { display: flex; flex-wrap: wrap; gap: 8px; font-family: system-ui, sans-serif; }
    .hints button { background: transparent; border: 1px dashed var(--brass); color: var(--brass); border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; }

    .msg { text-align: center; font-size: 16px; padding: 12px; font-family: system-ui, sans-serif; }
    .msg.err { color: #dc2626; }
    .spin { width: 32px; height: 32px; border: 3px solid #e6d7b8; border-top-color: var(--brass); border-radius: 50%; margin: 20px auto; animation: r .8s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }

    .book { display: flex; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; animation: rise .35s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .spine { width: 14px; background: var(--brass); flex-shrink: 0; }
    .page { padding: 18px; flex: 1; }
    .page h2 { font-size: 22px; font-weight: 800; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-family: system-ui, sans-serif; }
    .row .k { width: 120px; color: var(--muted); font-size: 13px; }
    .row b { font-weight: 600; }
    .row .n { font-size: 18px; font-weight: 900; }
    .pill { display: inline-block; margin-top: 8px; background: rgba(22,163,74,.12); color: #166534; font-weight: 700; font-size: 12px; border-radius: 20px; padding: 5px 12px; font-family: system-ui, sans-serif; }
    .warn { color: #dc2626; font-weight: 700; font-size: 16px; margin-top: 8px; font-family: system-ui, sans-serif; }

    .console { width: 320px; max-width: 100%; background: #20150f; color: #e6d3b6; border-radius: 20px; padding: 18px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .console h3 { font-family: system-ui, sans-serif; font-size: 15px; color: #e4b94b; margin-bottom: 4px; }
    .console p { color: #a98f74; margin-bottom: 12px; line-height: 1.5; }
    .console pre { background: #140d09; border-radius: 10px; padding: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="app-bar ui">Library Book Search</div>
    <div class="body">
      <div class="banner">
        <div class="em">📚</div>
        <div><h1>The Reading Room</h1><p>Type a title to look it up on the shelves.</p></div>
      </div>

      <form class="search" id="form">
        <label><span class="ico">📖</span><input id="title" placeholder="Enter Book Title" autocomplete="off" /></label>
        <button class="btn" id="go" type="submit">🔍 Search</button>
        <div class="hints" id="hints"></div>
      </form>

      <div id="result"></div>
    </div>
  </div>

  <aside class="console">
    <h3>☁️ books collection (mock)</h3>
    <p>Read-only: the app only calls <code>books.get()</code> and matches the normalised title.</p>
    <pre id="docs"></pre>
  </aside>

<script>
  const $ = id => document.getElementById(id);
  // Copy of the Firestore "books" collection used for the demo
  const books = [
    { title: 'Flutter Basics', author: 'John Smith', copies: 5 },
    { title: 'Data Structures', author: 'David', copies: 0 },
    { title: 'Artificial Intelligence', author: 'Andrew', copies: 3 },
  ];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Trim, collapse spaces, lowercase – same as the Dart _normalize()
  const normalize = v => v.trim().replace(/\s+/g, ' ').toLowerCase();

  $('docs').textContent = JSON.stringify(books, null, 1);
  $('hints').innerHTML = books.map(b => `<button type="button">${esc(b.title)}</button>`).join('');
  $('hints').onclick = e => { if (e.target.tagName === 'BUTTON') { $('title').value = e.target.textContent; $('form').requestSubmit(); } };

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const q = normalize($('title').value);
    if (!q) { $('result').innerHTML = '<div class="msg err">Please enter a book title to search</div>'; return; }

    // simulate the network round trip of books.get()
    $('go').disabled = true;
    $('result').innerHTML = '<div class="spin"></div>';
    setTimeout(() => {
      $('go').disabled = false;
      const b = books.find(x => normalize(x.title) === q);
      if (!b) { $('result').innerHTML = '<div class="msg err">Book not found</div>'; return; }
      $('result').innerHTML = `
        <div class="book"><div class="spine"></div><div class="page">
          <h2>${esc(b.title)}</h2>
          <div class="row"><span>👤</span><span class="k">Author</span><b>${esc(b.author)}</b></div>
          <div class="row"><span>📦</span><span class="k">Copies Available</span><span class="n">${b.copies}</span></div>
          ${b.copies > 0 ? '<span class="pill">In stock</span>' : '<div class="warn">Not Available – All Copies Issued</div>'}
        </div></div>`;
    }, 450);
  });
</script>
</body>
</html>
